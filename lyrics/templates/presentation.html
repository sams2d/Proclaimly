<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Presentation Output</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
            color: #fff;
            text-align: center;
            padding: 60px;
            transition: background .3s ease;
        }

        body.bg-alt {
            background: linear-gradient(160deg, #101828, #1b1b1b);
        }

        #slide-text {
            font-size: 3vw;
            line-height: 1.45;
            white-space: pre-line;
            max-width: 90%;
        }

        /* Black Screen forces the text invisible regardless of state */
        body.blackout #slide-text {
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div id="slide-text"></div>

    {{ standby_text|json_script:"standby-text-data" }}

    <script>
        const STANDBY_TEXT = JSON.parse(
            document.getElementById('standby-text-data').textContent
        );
        const slideEl = document.getElementById('slide-text');
        const channel = new BroadcastChannel('presentation');

        function render(state) {
            document.body.classList.toggle('blackout', !!(state && state.blackout));
            document.body.classList.toggle('bg-alt', !!(state && state.altBackground));

            if (!state || !state.songId || state.cleared) {
                // Nothing selected / cleared -> show the standby verse
                slideEl.textContent = state && state.cleared ? '' : STANDBY_TEXT;
                return;
            }

            const slides = state.slides || [];
            slideEl.textContent = slides[state.slideIndex] || '';
        }

        // Catch up on state set before this window existed
        // (BroadcastChannel doesn't replay old messages to late joiners)
        try {
            const saved = localStorage.getItem('presentationState');
            render(saved ? JSON.parse(saved) : null);
        } catch (e) {
            render(null);
        }

        // Live updates from the controller
        channel.onmessage = (event) => render(event.data);

        // Fallback: also react to storage events, in case BroadcastChannel
        // isn't available/blocked in some environment
        window.addEventListener('storage', (event) => {
            if (event.key === 'presentationState' && event.newValue) {
                render(JSON.parse(event.newValue));
            }
        });
    </script>

</body>
</html>
